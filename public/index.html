<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard</title>
   
  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="styles/global.css">
  <link rel="stylesheet" href="styles/dashboard.css">
</head>

<body class="page page-dashboard">

<header class="topbar text-center p-3 bg-light">
  <h4 data-i18n="dashboardGreeting">Mijn Gezondheid</h4>
</header>

<h4 id="groet" data-i18n="dashboardGreeting">Mijn Gezondheid</h4>

<main class="container py-3">

  <div class="card p-3 mb-3 dateText">
    <p id="dateText" class="mb-0 text-muted"></p>
  </div>

  <!-- Calorieën -->
  <div class="card p-3 mb-3 stat d-flex align-items-center" data-href="tracker.html">
    <div class="icon green me-3">
      <span class="material-symbols-outlined">restaurant</span>
    </div>
    <div class="flex-grow-1">
      <div class="d-flex justify-content-between align-items-center mb-1">
        <h5 class="mb-0" data-i18n="calories">Calorieën</h5>
        <span class="text-muted small" id="kcal-rest"></span>
      </div>
      <div class="bar-bg"><div class="bar bar-green" id="bar-kcal"></div></div>
      <p class="mb-0 small mt-1"><span class="big" id="kcal-gegeten">0</span> / <span id="kcal-doel">—</span> kcal</p>
    </div>
  </div>

  <!-- Water -->
  <div class="card p-3 mb-3 stat d-flex align-items-center" data-href="tracker.html">
    <div class="icon blue me-3">
      <span class="material-symbols-outlined">water_drop</span>
    </div>
    <div class="flex-grow-1">
      <div class="d-flex justify-content-between align-items-center mb-1">
        <h5 class="mb-0" data-i18n="water">Water </h5>
        <span class="text-muted small" id="water-rest"></span>
      </div>
      <div class="bar-bg"><div class="bar bar-blue" id="bar-water"></div></div>
      <p class="mb-0 small mt-1"><span class="big" id="water-gedronken">0</span> / <span id="water-doel">—</span> L</p>
    </div>
  </div>

  <!-- Slaap -->
  <div class="card p-3 mb-3 stat d-flex align-items-center" data-href="tracker.html">
    <div class="icon purple me-3">
      <span class="material-symbols-outlined">bedtime</span>
    </div>
    <div class="flex-grow-1">
      <div class="d-flex justify-content-between align-items-center mb-1">
        <h5 class="mb-0" data-i18n="sleep">Slaap</h5>
        <span class="text-muted small" id="slaap-rest"></span>
      </div>
      <div class="bar-bg"><div class="bar bar-purple" id="bar-slaap"></div></div>
      <p class="mb-0 small mt-1"><span class="big" id="slaap-uur">0</span> / <span id="slaap-doel">—</span> uur</p>
    </div>
  </div>

  <!-- Activiteit -->
  <div class="card p-3 mb-3 stat d-flex align-items-center" data-href="tracker.html">
    <div class="icon orange me-3">
      <span class="material-symbols-outlined">directions_run</span>
    </div>
    <div class="flex-grow-1">
      <div class="d-flex justify-content-between align-items-center mb-1">
        <h5 class="mb-0" data-i18n="activity">Activiteit</h5>
        <span class="text-muted small" id="act-rest"></span>
      </div>
      <div class="bar-bg"><div class="bar bar-orange" id="bar-act"></div></div>
      <p class="mb-0 small mt-1"><span class="big" id="act-min">0</span> / <span id="act-doel">—</span> min</p>
    </div>
  </div>

  <!-- Motivatieberichtje -->
  <div class="card p-3 mb-3" id="motivatie-card" style="display:none">
    <p class="mb-0" id="motivatie-tekst"></p>
  </div>

</main>

<div id="navbar"></div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
  const profiel  = getProfiel();
  const limieten = getLimieten();
  const totalen  = getTotalen();

  // Groet
  const naam = profiel.naam;
  const uur  = new Date().getHours();
  const dag  = uur < 12 ? t("goodMorning") : uur < 18 ? t("goodAfternoon") : t("goodEvening");
  if (naam) document.getElementById("groet").textContent = dag + ", " + naam + "!";

  // Datum
  document.getElementById("dateText").textContent = formatDate(new Date(), {
    weekday: "long", year: "numeric", month: "long", day: "numeric"
  });

  // Doelen invullen
  document.getElementById("kcal-doel").textContent  = limieten.kcal;
  document.getElementById("water-doel").textContent = limieten.water;
  document.getElementById("slaap-doel").textContent = limieten.slaap;
  document.getElementById("act-doel").textContent   = limieten.activiteit;

  // Totalen invullen
  document.getElementById("kcal-gegeten").textContent    = totalen.kcal;
  document.getElementById("water-gedronken").textContent = totalen.water;
  document.getElementById("slaap-uur").textContent       = totalen.slaap;
  document.getElementById("act-min").textContent         = totalen.activiteit;

  // Resterend
  const kcalRest = limieten.kcal - totalen.kcal;
  document.getElementById("kcal-rest").textContent = kcalRest >= 0
    ? kcalRest + " " + t("caloriesOverTarget") : Math.abs(kcalRest) + " " + t("caloriesOverLimit");

  const waterRest = Math.round((limieten.water - totalen.water) * 10) / 10;
  document.getElementById("water-rest").textContent = waterRest > 0
    ? waterRest + " L " + t("toGo") : t("goalReached");

  document.getElementById("slaap-rest").textContent = totalen.slaap >= limieten.slaap
    ? t("goalReached") : (limieten.slaap - totalen.slaap) + " uur " + t("toGo");

  document.getElementById("act-rest").textContent = totalen.activiteit >= limieten.activiteit
    ? t("goalReached") : (limieten.activiteit - totalen.activiteit) + " min " + t("toGo");

  // Progress bars animeren
  function pct(val, max) { return Math.min(100, Math.round(val / max * 100)) + "%"; }
  setTimeout(() => {
    document.getElementById("bar-kcal").style.width   = pct(totalen.kcal,       limieten.kcal);
    document.getElementById("bar-water").style.width  = pct(totalen.water,      limieten.water);
    document.getElementById("bar-slaap").style.width  = pct(totalen.slaap,      limieten.slaap);
    document.getElementById("bar-act").style.width    = pct(totalen.activiteit, limieten.activiteit);
  }, 80);

  // Motivatie
  const berichten = [];
  if (kcalRest > 0 && kcalRest < 300) berichten.push("💪 " + (getLanguage() === "en" ? "Almost at your calorie goal — " : "Bijna op je caloriedoel — nog ") + kcalRest + " kcal!");
  if (totalen.water >= limieten.water) berichten.push("💧 " + (getLanguage() === "en" ? "Great job, your water goal is already reached!" : "Goed bezig, je waterdoel is al gehaald!"));
  if (totalen.slaap >= limieten.slaap) berichten.push("😴 " + (getLanguage() === "en" ? "Great, you got enough sleep!" : "Super, je hebt genoeg geslapen!"));
  if (totalen.activiteit >= limieten.activiteit) berichten.push("🏃 " + (getLanguage() === "en" ? "Your activity goal is reached, nice!" : "Je activiteitsdoel is bereikt, top!"));
  if (totalen.kcal === 0 && totalen.water === 0) berichten.push(t("nothingLogged"));

  if (berichten.length > 0) {
    document.getElementById("motivatie-card").style.display = "";
    document.getElementById("motivatie-tekst").textContent = berichten[0];
  }
</script>

</body>
</html>
