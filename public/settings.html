<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings</title>
   
  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="styles/global.css">
  <link rel="stylesheet" href="styles/settings.css">
</head>

<body class="page page-settings">

<header class="topbar text-center p-3 bg-light">
  <h4>Settings</h4>
</header>

<main class="container py-3">

  <!-- Profiel -->
  <p class="sectie-label">👤 Profiel</p>
  <div class="card p-3 mb-3">
    <div class="mb-3">
      <label class="form-label fw-semibold">Naam</label>
      <input type="text" class="form-control" id="naam" placeholder="Jouw naam">
    </div>
    <div class="row g-2 mb-3">
      <div class="col-4">
        <label class="form-label fw-semibold">Leeftijd</label>
        <div class="input-group">
          <input type="number" class="form-control" id="leeftijd" placeholder="25">
          <span class="input-group-text">jr</span>
        </div>
      </div>
      <div class="col-4">
        <label class="form-label fw-semibold">Gewicht</label>
        <div class="input-group">
          <input type="number" class="form-control" id="gewicht" placeholder="70">
          <span class="input-group-text">kg</span>
        </div>
      </div>
      <div class="col-4">
        <label class="form-label fw-semibold">Lengte</label>
        <div class="input-group">
          <input type="number" class="form-control" id="lengte" placeholder="175">
          <span class="input-group-text">cm</span>
        </div>
      </div>
    </div>
    <div class="mb-3">
      <label class="form-label fw-semibold">Geslacht</label>
      <div class="d-flex gap-2">
        <button class="btn flex-fill geslacht-btn" data-val="man" id="btn-man">♂ Man</button>
        <button class="btn flex-fill geslacht-btn" data-val="vrouw" id="btn-vrouw">♀ Vrouw</button>
      </div>
    </div>
    <div class="mb-3">
      <label class="form-label fw-semibold">Doel</label>
      <div class="d-flex gap-2 flex-wrap">
        <button class="btn flex-fill doel-btn" data-val="afvallen" id="btn-afvallen">📉 Afvallen</button>
        <button class="btn flex-fill doel-btn" data-val="onderhoud" id="btn-onderhoud">⚖️ Op gewicht blijven</button>
        <button class="btn flex-fill doel-btn" data-val="aankomen" id="btn-aankomen">📈 Aankomen</button>
      </div>
    </div>
    <button class="btn btn-success w-100 fw-semibold" id="saveBtn">
      <span class="material-symbols-outlined align-middle me-1" style="font-size:18px">save</span>
      Opslaan
    </button>
    <p class="text-success text-center mt-2 mb-0 small d-none" id="savedMsg">✓ Profiel opgeslagen!</p>
  </div>

  <!-- Berekende limieten -->
  <p class="sectie-label">📊 Jouw daglimieten</p>
  <div class="card p-3 mb-3" id="limieten-card">
    <div class="limiet-rij">
      <span class="material-symbols-outlined limiet-icon" style="color:#16a34a">restaurant</span>
      <span>Calorieën</span>
      <span class="fw-bold ms-auto" id="lim-kcal">—</span>
    </div>
    <div class="limiet-rij">
      <span class="material-symbols-outlined limiet-icon" style="color:#2563eb">water_drop</span>
      <span>Water</span>
      <span class="fw-bold ms-auto" id="lim-water">—</span>
    </div>
    <div class="limiet-rij">
      <span class="material-symbols-outlined limiet-icon" style="color:#7e22ce">bedtime</span>
      <span>Slaap</span>
      <span class="fw-bold ms-auto" id="lim-slaap">—</span>
    </div>
    <div class="limiet-rij">
      <span class="material-symbols-outlined limiet-icon" style="color:#ea580c">directions_run</span>
      <span>Activiteit</span>
      <span class="fw-bold ms-auto" id="lim-activiteit">—</span>
    </div>
  </div>

  <!-- Weergave -->
  <p class="sectie-label">🎨 Weergave</p>
  <div class="card p-3 mb-3 d-flex justify-content-between align-items-center flex-row">
    <div>
      <div class="fw-semibold">Dark mode</div>
      <small class="text-muted">Donker thema</small>
    </div>
    <div class="form-check form-switch mb-0">
      <input class="form-check-input" type="checkbox" id="darkModeToggle" role="switch" style="width:3em;height:1.5em;">
    </div>
  </div>

  <!-- Data wissen -->
  <p class="sectie-label">⚠️ Data</p>
  <div class="card p-3 mb-3">
    <button class="btn btn-outline-danger w-100" id="resetBtn">
      <span class="material-symbols-outlined align-middle me-1" style="font-size:18px">delete</span>
      Alle data wissen
    </button>
  </div>

</main>
</main>

<div id="navbar"></div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>

<script>
  // Profiel inladen
  const p = getProfiel();
  if (p.naam)     document.getElementById("naam").value     = p.naam;
  if (p.leeftijd) document.getElementById("leeftijd").value = p.leeftijd;
  if (p.gewicht)  document.getElementById("gewicht").value  = p.gewicht;
  if (p.lengte)   document.getElementById("lengte").value   = p.lengte;

  // Geslacht & doel knoppen activeren
  let geslacht = p.geslacht || "man";
  let doel     = p.doel     || "onderhoud";

  function updateGeslachtBtns() {
    document.querySelectorAll(".geslacht-btn").forEach(b => {
      b.classList.toggle("btn-primary",   b.dataset.val === geslacht);
      b.classList.toggle("btn-outline-secondary", b.dataset.val !== geslacht);
    });
  }
  function updateDoelBtns() {
    document.querySelectorAll(".doel-btn").forEach(b => {
      b.classList.toggle("btn-success",          b.dataset.val === doel);
      b.classList.toggle("btn-outline-secondary", b.dataset.val !== doel);
    });
  }
  updateGeslachtBtns();
  updateDoelBtns();

  document.querySelectorAll(".geslacht-btn").forEach(b => {
    b.addEventListener("click", () => { geslacht = b.dataset.val; updateGeslachtBtns(); updateLimieten(); });
  });
  document.querySelectorAll(".doel-btn").forEach(b => {
    b.addEventListener("click", () => { doel = b.dataset.val; updateDoelBtns(); updateLimieten(); });
  });

  // Limieten live updaten
  function updateLimieten() {
    // Tijdelijk profiel bouwen met huidige invoervelden
    const tijdelijk = {
      geslacht,
      doel,
      gewicht:  document.getElementById("gewicht").value  || 70,
      lengte:   document.getElementById("lengte").value   || 175,
      leeftijd: document.getElementById("leeftijd").value || 25,
    };
    // Tijdelijk opslaan zodat getLimieten() het oppikt
    const oud = getProfiel();
    saveProfiel({ ...oud, ...tijdelijk });
    const l = getLimieten();
    saveProfiel(oud); // terugzetten tot echt opslaan

    document.getElementById("lim-kcal").textContent      = l.kcal + " kcal";
    document.getElementById("lim-water").textContent     = l.water + " L";
    document.getElementById("lim-slaap").textContent     = l.slaap + " uur";
    document.getElementById("lim-activiteit").textContent = l.activiteit + " min";
  }

  // Live updaten bij typen
  ["gewicht","lengte","leeftijd"].forEach(id => {
    document.getElementById(id).addEventListener("input", updateLimieten);
  });
  updateLimieten();

  // Opslaan
  document.getElementById("saveBtn").addEventListener("click", () => {
    saveProfiel({
      naam:     document.getElementById("naam").value,
      leeftijd: document.getElementById("leeftijd").value,
      gewicht:  document.getElementById("gewicht").value,
      lengte:   document.getElementById("lengte").value,
      geslacht,
      doel,
    });
    updateLimieten();
    const msg = document.getElementById("savedMsg");
    msg.classList.remove("d-none");
    setTimeout(() => msg.classList.add("d-none"), 2500);
  });

  // Data wissen
  document.getElementById("resetBtn").addEventListener("click", () => {
    if (confirm("Weet je zeker dat je alle data wilt wissen?")) {
      localStorage.clear();
      location.reload();
    }
  });
</script>


</body>
</html>
