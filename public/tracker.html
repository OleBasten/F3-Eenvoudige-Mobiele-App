<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tracker</title>
   
  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="styles/global.css">
  <link rel="stylesheet" href="styles/tracker.css">
</head>

<body class="page page-tracker">

<header class="topbar text-center p-3 bg-light">
  <h4>Tracker</h4>
</header>

<main class="container py-3">

  <div class="card p-3 mb-3 dateText">
    <p id="dateText" class="mb-0 text-muted"></p>
  </div>

  <!-- ETEN -->
  <p class="sectie-label">🍽️ Eten</p>

  <div class="card p-3 mb-2" id="maaltijden-lijst">
    <p class="text-muted text-center mb-0" id="geen-maaltijden">Nog niets toegevoegd vandaag</p>
  </div>

  <div class="card p-3 mb-3">
    <div class="row g-2">
      <div class="col-12">
        <input type="text" class="form-control" id="eten-naam" placeholder="Naam (bijv. Havermout)">
      </div>
      <div class="col-6">
        <div class="input-group">
          <input type="number" class="form-control" id="eten-kcal" placeholder="kcal" min="1">
          <span class="input-group-text">kcal</span>
        </div>
      </div>
      <div class="col-6">
        <select class="form-select" id="eten-type">
          <option value="ontbijt">Ontbijt</option>
          <option value="lunch">Lunch</option>
          <option value="diner">Diner</option>
          <option value="snack">Snack</option>
        </select>
      </div>
      <div class="col-12">
        <button class="btn btn-success w-100" id="voeg-eten-toe">
          <span class="material-symbols-outlined align-middle me-1" style="font-size:18px">add</span>
          <span id="eten-btn-text">Maaltijd toevoegen</span>
        </button>
      </div>
    </div>
  </div>

  <!-- WATER -->
  <p class="sectie-label">💧 Water</p>
  <div class="card p-3 mb-3">
    <div class="d-flex align-items-center justify-content-between mb-3">
      <span class="fw-semibold">Vandaag gedronken</span>
      <span class="fw-bold fs-5 text-primary" id="water-display">0 L</span>
    </div>
    <div class="d-flex gap-2">
      <button class="btn btn-outline-primary flex-fill water-btn" data-amount="0.25">+250ml</button>
      <button class="btn btn-outline-primary flex-fill water-btn" data-amount="0.5">+500ml</button>
      <button class="btn btn-outline-primary flex-fill water-btn" data-amount="1">+1L</button>
      <button class="btn btn-outline-danger flex-fill" id="water-reset">↩</button>
    </div>
  </div>

  <!-- SLAAP -->
  <p class="sectie-label">😴 Slaap</p>
  <div class="card p-3 mb-3">
    <div class="d-flex align-items-center gap-3">
      <div class="flex-grow-1">
        <div class="input-group">
          <input type="number" class="form-control" id="slaap-uur" placeholder="Bijv. 7.5" step="0.5" min="0" max="24">
          <span class="input-group-text">uur</span>
        </div>
      </div>
      <button class="btn btn-success" id="slaap-opslaan">Opslaan</button>
    </div>
    <p class="text-success mt-2 mb-0 small" id="slaap-status"></p>
  </div>

  <!-- ACTIVITEIT -->
  <p class="sectie-label">🏃 Activiteit</p>
  <div class="card p-3 mb-3">
    <div class="row g-2">
      <div class="col-8">
        <input type="text" class="form-control" id="activiteit-naam" placeholder="Bijv. Fietsen, Wandelen">
      </div>
      <div class="col-4">
        <div class="input-group">
          <input type="number" class="form-control" id="activiteit-min" placeholder="30" min="1">
          <span class="input-group-text">min</span>
        </div>
      </div>
      <div class="col-12">
        <button class="btn btn-success w-100" id="voeg-activiteit-toe">
          <span class="material-symbols-outlined align-middle me-1" style="font-size:18px">add</span>
          Activiteit toevoegen
        </button>
      </div>
    </div>
    <div id="activiteit-lijst" class="mt-2"></div>
  </div>

</main>
</main>

<div id="navbar"></div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
  let dagData = getDagData();

  // Datum
  document.getElementById("dateText").textContent = new Date().toLocaleDateString("nl-NL", {
    weekday: "long", year: "numeric", month: "long", day: "numeric"
  });

  // ── Maaltijden ──
  let editingMealIndex = null;

  function renderMaaltijden() {
    const lijst = document.getElementById("maaltijden-lijst");
    const geen  = document.getElementById("geen-maaltijden");
    lijst.querySelectorAll(".maaltijd-rij").forEach(e => e.remove());

    if (dagData.maaltijden.length === 0) { geen.style.display = ""; return; }
    geen.style.display = "none";

    dagData.maaltijden.forEach((m, i) => {
      const div = document.createElement("div");
      div.className = "maaltijd-rij d-flex justify-content-between align-items-center py-2";
      if (i < dagData.maaltijden.length - 1) div.style.borderBottom = "1px solid #eee";
      div.innerHTML = `
        <div class="d-flex align-items-center gap-2">
          <span class="badge-type badge-${m.type}">${m.type}</span>
          <span>${m.naam}</span>
        </div>
        <div class="d-flex align-items-center gap-2">
          <span class="fw-semibold">${m.kcal} kcal</span>
          <button class="btn btn-sm btn-link text-primary p-0 edit-maaltijd" data-i="${i}">
            <span class="material-symbols-outlined" style="font-size:18px">edit</span>
          </button>
          <button class="btn btn-sm btn-link text-danger p-0 delete-maaltijd" data-i="${i}">
            <span class="material-symbols-outlined" style="font-size:18px">delete</span>
          </button>
        </div>`;
      lijst.appendChild(div);
    });

    lijst.querySelectorAll(".edit-maaltijd").forEach(btn => {
      btn.addEventListener("click", () => {
        const i = parseInt(btn.dataset.i);
        const m = dagData.maaltijden[i];
        editingMealIndex = i;
        document.getElementById("eten-naam").value = m.naam;
        document.getElementById("eten-kcal").value = m.kcal;
        document.getElementById("eten-type").value = m.type;
        document.getElementById("eten-btn-text").textContent = "Wijziging opslaan";
        document.getElementById("eten-naam").focus();
      });
    });

    lijst.querySelectorAll(".delete-maaltijd").forEach(btn => {
      btn.addEventListener("click", () => {
        dagData.maaltijden.splice(parseInt(btn.dataset.i), 1);
        saveDagData(dagData);
        renderMaaltijden();
      });
    });
  }

  document.getElementById("voeg-eten-toe").addEventListener("click", () => {
    const naam = document.getElementById("eten-naam").value.trim();
    const kcal = parseInt(document.getElementById("eten-kcal").value);
    const type = document.getElementById("eten-type").value;
    if (!naam || isNaN(kcal) || kcal <= 0) { alert("Vul een naam en geldig aantal kcal in."); return; }

    if (editingMealIndex !== null) {
      dagData.maaltijden[editingMealIndex] = { naam, kcal, type };
      editingMealIndex = null;
      document.getElementById("eten-btn-text").textContent = "Maaltijd toevoegen";
    } else {
      dagData.maaltijden.push({ naam, kcal, type });
    }

    saveDagData(dagData);
    renderMaaltijden();
    document.getElementById("eten-naam").value = "";
    document.getElementById("eten-kcal").value = "";
  });

  // ── Water ──
  function renderWater() {
    document.getElementById("water-display").textContent =
      Math.round(dagData.water * 100) / 100 + " L";
  }

  document.querySelectorAll(".water-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      dagData.water = Math.round((dagData.water + parseFloat(btn.dataset.amount)) * 100) / 100;
      saveDagData(dagData);
      renderWater();
    });
  });

  document.getElementById("water-reset").addEventListener("click", () => {
    if (confirm("Water terugzetten naar 0?")) {
      dagData.water = 0;
      saveDagData(dagData);
      renderWater();
    }
  });

  // ── Slaap ──
  function renderSlaap() {
    if (dagData.slaap > 0) {
      document.getElementById("slaap-uur").value = dagData.slaap;
      document.getElementById("slaap-status").textContent = "✓ " + dagData.slaap + " uur opgeslagen";
    }
  }

  document.getElementById("slaap-opslaan").addEventListener("click", () => {
    const uur = parseFloat(document.getElementById("slaap-uur").value);
    if (isNaN(uur) || uur <= 0 || uur > 24) { alert("Vul een geldig aantal uren in (0-24)."); return; }
    dagData.slaap = uur;
    saveDagData(dagData);
    renderSlaap();
  });

  // ── Activiteit ──
  let editingActivityIndex = null;

  function renderActiviteit() {
    const lijst = document.getElementById("activiteit-lijst");
    lijst.innerHTML = "";
    const acts = dagData.activiteiten || [];
    if (acts.length === 0) return;

    acts.forEach((a, i) => {
      const div = document.createElement("div");
      div.className = "d-flex justify-content-between align-items-center py-2";
      if (i > 0) div.style.borderTop = "1px solid #eee";
      div.innerHTML = `
        <span>🏃 ${a.naam}</span>
        <div class="d-flex align-items-center gap-2">
          <span class="fw-semibold">${a.min} min</span>
          <button class="btn btn-sm btn-link text-primary p-0 edit-act" data-i="${i}">
            <span class="material-symbols-outlined" style="font-size:18px">edit</span>
          </button>
          <button class="btn btn-sm btn-link text-danger p-0 delete-act" data-i="${i}">
            <span class="material-symbols-outlined" style="font-size:18px">delete</span>
          </button>
        </div>`;
      lijst.appendChild(div);
    });

    lijst.querySelectorAll(".edit-act").forEach(btn => {
      btn.addEventListener("click", () => {
        const i = parseInt(btn.dataset.i);
        const a = dagData.activiteiten[i];
        editingActivityIndex = i;
        document.getElementById("activiteit-naam").value = a.naam;
        document.getElementById("activiteit-min").value = a.min;
        document.getElementById("activiteit-naam").focus();
      });
    });

    lijst.querySelectorAll(".delete-act").forEach(btn => {
      btn.addEventListener("click", () => {
        dagData.activiteiten.splice(parseInt(btn.dataset.i), 1);
        dagData.activiteit = dagData.activiteiten.reduce((s, a) => s + a.min, 0);
        saveDagData(dagData);
        renderActiviteit();
      });
    });
  }

  document.getElementById("voeg-activiteit-toe").addEventListener("click", () => {
    const naam = document.getElementById("activiteit-naam").value.trim();
    const min  = parseInt(document.getElementById("activiteit-min").value);
    if (!naam || isNaN(min) || min <= 0) { alert("Vul een naam en geldig aantal minuten in."); return; }
    if (!dagData.activiteiten) dagData.activiteiten = [];

    if (editingActivityIndex !== null) {
      dagData.activiteiten[editingActivityIndex] = { naam, min };
      editingActivityIndex = null;
    } else {
      dagData.activiteiten.push({ naam, min });
    }

    dagData.activiteit = dagData.activiteiten.reduce((s, a) => s + a.min, 0);
    saveDagData(dagData);
    renderActiviteit();
    document.getElementById("activiteit-naam").value = "";
    document.getElementById("activiteit-min").value  = "";
  });

  // ── Init ──
  renderMaaltijden();
  renderWater();
  renderSlaap();
  renderActiviteit();
</script>

</body>
</html>
