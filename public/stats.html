<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stats</title>
   
  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="styles/global.css">

  <link rel="stylesheet" href="styles/stats.css">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
</head>

<body>

<header class="topbar text-center p-3 bg-light">
  <h4>Stats</h4>
</header>

<main class="container py-3">
  <main class="container py-3">

  <div class="card p-3 mb-3 dateText">
    <p id="dateText" class="mb-0 text-muted"></p>
  </div>

  <!-- Overzicht deze week -->
  <p class="sectie-label">📊 Deze week</p>
  <div class="card p-3 mb-3">
    <div class="row text-center g-2" id="week-overzicht"></div>
  </div>

  <!-- Calorieën grafiek -->
  <p class="sectie-label">🍽️ Calorieën (7 dagen)</p>
  <div class="card p-3 mb-3">
    <div class="grafiek-wrapper">
      <div class="grafiek" id="grafiek-kcal"></div>
    </div>
  </div>

  <!-- Water grafiek -->
  <p class="sectie-label">💧 Water (7 dagen)</p>
  <div class="card p-3 mb-3">
    <div class="grafiek-wrapper">
      <div class="grafiek" id="grafiek-water"></div>
    </div>
  </div>

  <!-- Gemiddelden -->
  <p class="sectie-label">📈 Gemiddelden deze week</p>
  <div class="card p-3 mb-3">
    <div class="row g-3" id="gemiddelden"></div>
  </div>

  <!-- Streaks -->
  <p class="sectie-label">🔥 Streaks</p>
  <div class="card p-3 mb-3" id="streaks-card"></div>

</main>
</main>

<div id="navbar"></div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
  document.getElementById("dateText").textContent = new Date().toLocaleDateString("nl-NL", {
    weekday: "long", year: "numeric", month: "long", day: "numeric"
  });

  const limieten = getLimieten();
  const dagen    = getLaatsteDagen(7);

  // ── Week overzicht ──
  function weekOverzicht() {
    const el = document.getElementById("week-overzicht");
    const vandaagStr = vandaag();

    dagen.forEach(d => {
      const isVandaag = d.datum === vandaagStr;
      const kcalOk  = d.kcal > 0 && d.kcal <= limieten.kcal * 1.1;
      const waterOk = d.water >= limieten.water;
      const slaapOk = d.slaap >= limieten.slaap;
      const actOk   = d.activiteit >= limieten.activiteit;
      const score   = [kcalOk, waterOk, slaapOk, actOk].filter(Boolean).length;

      const kleur = score === 4 ? "#22c55e" : score >= 2 ? "#f59e0b" : "#e5e7eb";
      const emoji = score === 4 ? "🌟" : score >= 2 ? "👍" : "–";

      el.innerHTML += `
        <div class="col">
          <div class="dag-blok ${isVandaag ? 'dag-vandaag' : ''}" style="background:${kleur}">
            <div class="dag-label">${d.label.split(" ")[0]}</div>
            <div class="dag-emoji">${emoji}</div>
          </div>
        </div>`;
    });
  }
  weekOverzicht();

  // ── Staafgrafiek ──
  function tekenGrafiek(containerId, data, max, kleur, eenheid) {
    const container = document.getElementById(containerId);
    const echteMax  = Math.max(...data.map(d => d.waarde), max) || 1;

    container.innerHTML = data.map(d => {
      const hoogte    = Math.round((d.waarde / echteMax) * 100);
      const isVandaag = d.datum === vandaag();
      return `
        <div class="staaf-wrapper">
          <div class="staaf-waarde">${d.waarde > 0 ? d.waarde + eenheid : ""}</div>
          <div class="staaf-balk-wrapper">
            <div class="staaf-doel" style="bottom:${Math.round((max / echteMax) * 100)}%"></div>
            <div class="staaf-balk" style="height:${hoogte}%; background:${isVandaag ? kleur : kleur + "99"}"></div>
          </div>
          <div class="staaf-label">${d.label.split(" ")[0]}</div>
        </div>`;
    }).join("");
  }

  tekenGrafiek("grafiek-kcal",
    dagen.map(d => ({ ...d, waarde: d.kcal })),
    limieten.kcal, "#22c55e", "");

  tekenGrafiek("grafiek-water",
    dagen.map(d => ({ ...d, waarde: Math.round(d.water * 10) / 10 })),
    limieten.water, "#3b82f6", "L");

  // ── Gemiddelden ──
  function gem(arr) {
    const vals = arr.filter(v => v > 0);
    if (!vals.length) return 0;
    return Math.round((vals.reduce((a, b) => a + b, 0) / vals.length) * 10) / 10;
  }

  const gemKcal  = gem(dagen.map(d => d.kcal));
  const gemWater = gem(dagen.map(d => d.water));
  const gemSlaap = gem(dagen.map(d => d.slaap));
  const gemAct   = gem(dagen.map(d => d.activiteit));

  const gemEl = document.getElementById("gemiddelden");
  const stats = [
    { icon: "restaurant",     kleur: "green",  label: "Calorieën",  waarde: gemKcal  + " kcal", doel: limieten.kcal        + " kcal" },
    { icon: "water_drop",     kleur: "blue",   label: "Water",      waarde: gemWater + " L",    doel: limieten.water       + " L"    },
    { icon: "bedtime",        kleur: "purple", label: "Slaap",      waarde: gemSlaap + " uur",  doel: limieten.slaap       + " uur"  },
    { icon: "directions_run", kleur: "orange", label: "Activiteit", waarde: gemAct   + " min",  doel: limieten.activiteit  + " min"  },
  ];

  stats.forEach(s => {
    gemEl.innerHTML += `
      <div class="col-6">
        <div class="gem-kaart">
          <div class="gem-icon ${s.kleur}">
            <span class="material-symbols-outlined" style="font-size:20px">${s.icon}</span>
          </div>
          <div>
            <div class="fw-bold">${s.waarde}</div>
            <div class="text-muted small">${s.label} · doel: ${s.doel}</div>
          </div>
        </div>
      </div>`;
  });

  // ── Streaks ──
  function berekenStreak(checkFn) {
    let streak = 0;
    for (let i = dagen.length - 1; i >= 0; i--) {
      if (checkFn(dagen[i])) streak++;
      else break;
    }
    return streak;
  }

  const streaks = [
    { label: "Calorie doel gehaald",     streak: berekenStreak(d => d.kcal > 0 && d.kcal <= limieten.kcal * 1.1) },
    { label: "Waterdoel gehaald",        streak: berekenStreak(d => d.water >= limieten.water) },
    { label: "Slaapdoel gehaald",        streak: berekenStreak(d => d.slaap >= limieten.slaap) },
    { label: "Activiteitsdoel gehaald",  streak: berekenStreak(d => d.activiteit >= limieten.activiteit) },
  ];

  const streakEl = document.getElementById("streaks-card");
  streaks.forEach((s, i) => {
    const vuur = s.streak >= 3 ? "🔥" : s.streak >= 1 ? "✅" : "❌";
    streakEl.innerHTML += `
      <div class="d-flex justify-content-between align-items-center py-2 ${i > 0 ? 'border-top' : ''}">
        <span>${vuur} ${s.label}</span>
        <span class="fw-bold">${s.streak} dag${s.streak !== 1 ? "en" : ""}</span>
      </div>`;
  });
</script>


</body>
</html>
